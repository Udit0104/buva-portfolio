  <line x1="0" y1="150" x2="800" y2="150" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#334155" stroke-width="1" opacity="0.4"/>
