<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Decorative circles -->
  <circle cx="150" cy="200" r="120" fill="#6366f1" opacity="0.05"/>
  <circle cx="650" cy="250" r="100" fill="#8b5cf6" opacity="0.07"/>
  <!-- Fork & knife icon -->
  <line x1="370" y1="100" x2="370" y2="190" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 100 Q360 140 370 155" stroke="#818cf8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M380 100 Q380 140 370 155" stroke="#818cf8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="430" y1="100" x2="430" y2="190" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M420 100 L420 130 Q420 145 430 145 Q440 145 440 130 L440 100" stroke="#818cf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Plate -->
  <ellipse cx="400" cy="210" rx="80" ry="20" fill="none" stroke="#6366f1" stroke-width="3"/>
  <ellipse cx="400" cy="205" rx="55" ry="14" fill="#1e1b4b" opacity="0.8"/>
  <!-- Food items on plate -->
  <circle cx="390" cy="200" r="8" fill="#f97316" opacity="0.9"/>
  <circle cx="410" cy="200" r="7" fill="#84cc16" opacity="0.9"/>
  <circle cx="400" cy="194" r="6" fill="#fbbf24" opacity="0.9"/>
  <!-- Location pins for delivery -->
  <circle cx="200" cy="280" r="14" fill="#6366f1" opacity="0.8"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">A</text>
  <circle cx="600" cy="280" r="14" fill="#8b5cf6" opacity="0.8"/>
  <text x="600" y="285" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">B</text>
  <!-- Dashed delivery route -->
  <line x1="214" y1="280" x2="586" y2="280" stroke="#6366f1" stroke-width="2" stroke-dasharray="12,8" opacity="0.6"/>
  <!-- Scooter icon simplified -->
  <circle cx="400" cy="280" r="8" fill="#818cf8"/>
  <rect x="388" y="272" width="24" height="10" rx="4" fill="#6366f1"/>
  <!-- Title -->
  <text x="400" y="340" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">UniFood</text>
  <text x="400" y="368" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">unifoodhub.in — Food Delivery Platform</text>
  <!-- Tech badges -->
  <rect x="230" y="390" width="60" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="260" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">React</text>
  <rect x="305" y="390" width="72" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="341" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Node.js</text>
  <rect x="392" y="390" width="80" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="432" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">MongoDB</text>
  <rect x="487" y="390" width="70" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="522" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Stripe</text>
</svg>
