  <text x="125" y="225" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">Add to Cart</text>

  <!-- Card 2 -->
  <rect x="205" y="70" width="130" height="175" rx="10" fill="url(#shopGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="213" y="78" width="114" height="100" rx="6" fill="#4c1d95" opacity="0.7"/>
  <rect x="220" y="85" width="100" height="86" rx="4" fill="#1e0e3e"/>
  <rect x="228" y="93" width="84" height="70" rx="3" fill="#150b2e"/>
  <rect x="236" y="100" width="68" height="5" rx="2" fill="#c4b5fd" opacity="0.5"/>
  <rect x="236" y="112" width="52" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>
