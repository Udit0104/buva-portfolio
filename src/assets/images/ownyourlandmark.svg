<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-land)"/>
  
  <!-- Grid background lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Building / Real Estate Visual -->
  <!-- Building 1 -->
  <rect x="260" y="120" width="80" height="190" rx="4" fill="#0284c7" opacity="0.7"/>
  <!-- Windows -->
  <rect x="275" y="140" width="18" height="20" rx="2" fill="#38bdf8"/>
  <rect x="307" y="140" width="18" height="20" rx="2" fill="#38bdf8"/>
  <rect x="275" y="175" width="18" height="20" rx="2" fill="#38bdf8"/>
  <rect x="307" y="175" width="18" height="20" rx="2" fill="#38bdf8"/>
  <rect x="275" y="210" width="18" height="20" rx="2" fill="#38bdf8"/>
  <rect x="307" y="210" width="18" height="20" rx="2" fill="#38bdf8"/>

  <!-- Main Building / Tower -->
  <rect x="360" y="70" width="110" height="240" rx="6" fill="#0369a1" opacity="0.9"/>
  <!-- Windows -->
  <rect x="380" y="95" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="428" y="95" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="380" y="135" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="428" y="135" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="380" y="175" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="428" y="175" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="380" y="215" width="22" height="25" rx="3" fill="#7dd3fc"/>
  <rect x="428" y="215" width="22" height="25" rx="3" fill="#7dd3fc"/>

  <!-- Building 3 (House style) -->
  <path d="M 490 180 L 550 130 L 610 180 V 310 H 490 Z" fill="#0284c7" opacity="0.8"/>
  <rect x="525" y="220" width="40" height="90" rx="2" fill="#38bdf8"/>

  <!-- Map Pin / Landmark Icon -->
  <g transform="translate(415, 45)">
    <path d="M 0 -25 C -15 -25 -25 -15 -25 0 C -25 20 0 45 0 45 C 0 45 25 20 25 0 C 25 -15 15 -25 0 -25 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="-3" r="9" fill="#ffffff"/>
  </g>

  <!-- Ground Line -->
  <line x1="150" y1="310" x2="650" y2="310" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Title -->
  <text x="400" y="380" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="white" text-anchor="middle">OwnYourLandmark</text>
  <text x="400" y="410" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Real Estate &amp; Property Discovery Platform</text>
</svg>
