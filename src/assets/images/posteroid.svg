<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgPost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e0c2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgPost)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#6366f1" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#6366f1" stroke-width="0.3" opacity="0.12"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#6366f1" stroke-width="0.3" opacity="0.12"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#6366f1" stroke-width="0.3" opacity="0.12"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#6366f1" stroke-width="0.3" opacity="0.12"/>

  <!-- Product cards (left) -->
  <!-- Card 1 -->
  <rect x="60" y="70" width="130" height="175" rx="10" fill="url(#shopGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="68" y="78" width="114" height="100" rx="6" fill="#312e81" opacity="0.8"/>
  <!-- Poster preview art -->
  <rect x="78" y="88" width="94" height="80" rx="4" fill="#1e1b4b"/>
  <rect x="85" y="95" width="80" height="66" rx="3" fill="#0f0e2a"/>
  <line x1="85" y1="128" x2="165" y2="128" stroke="#818cf8" stroke-width="0.5" opacity="0.4"/>
  <rect x="92" y="102" width="56" height="6" rx="3" fill="#818cf8" opacity="0.5"/>
  <rect x="96" y="114" width="48" height="4" rx="2" fill="#6366f1" opacity="0.4"/>
  <rect x="100" y="134" width="40" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="88" y="144" width="64" height="12" rx="6" fill="#6366f1" opacity="0.6"/>
  <!-- Card label -->
