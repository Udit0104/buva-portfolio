  <rect x="517" y="184" width="80" height="4" rx="2" fill="#4b5563"/>
  <rect x="517" y="192" width="55" height="4" rx="2" fill="#4b5563"/>
  <rect x="670" y="179" width="46" height="18" rx="9" fill="#22c55e" opacity="0.15"/>
  <text x="693" y="191" font-family="system-ui, sans-serif" font-size="8" fill="#4ade80" text-anchor="middle">Shipped</text>

  <rect x="507" y="218" width="221" height="48" rx="6" fill="#1e293b"/>
  <rect x="507" y="218" width="4" height="48" rx="2" fill="#60a5fa"/>
  <text x="520" y="234" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#93c5fd">#1035 · Custom Upload · A3</text>
  <rect x="517" y="239" width="75" height="4" rx="2" fill="#4b5563"/>
  <rect x="517" y="247" width="50" height="4" rx="2" fill="#4b5563"/>
  <rect x="670" y="234" width="46" height="18" rx="9" fill="#60a5fa" opacity="0.15"/>
  <text x="693" y="246" font-family="system-ui, sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Delivered</text>

  <!-- Stats row -->
  <rect x="507" y="277" width="221" height="65" rx="8" fill="#1c1917"/>
  <rect x="515" y="286" width="55" height="46" rx="6" fill="#1e293b"/>
  <text x="542" y="304" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Orders</text>
  <text x="542" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">248</text>

  <rect x="578" y="286" width="55" height="46" rx="6" fill="#1e293b"/>
  <text x="605" y="304" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Revenue</text>
  <text x="605" y="320" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">₹1.2L</text>

  <rect x="641" y="286" width="55" height="46" rx="6" fill="#1e293b"/>
  <text x="668" y="304" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Custom</text>
  <text x="668" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f472b6" text-anchor="middle">63%</text>

  <!-- Title -->
  <text x="400" y="400" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">Posteroid</text>
  <text x="400" y="428" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">E-Commerce · Custom Prints · Shopify Hydrogen</text>
