<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgRide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgRide)"/>

  <!-- ── RIDER PHONE (left) ── -->
  <rect x="48" y="48" width="158" height="310" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="57" y="62" width="140" height="284" rx="8" fill="#111827"/>
  <!-- Notch -->
  <rect x="108" y="53" width="48" height="12" rx="6" fill="#1e293b"/>
  <!-- Map background on phone -->
  <rect x="57" y="62" width="140" height="160" rx="8" fill="url(#mapGrad)"/>
  <!-- Map grid lines -->
  <line x1="57" y1="95" x2="197" y2="95" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="57" y1="128" x2="197" y2="128" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="57" y1="161" x2="197" y2="161" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="90" y1="62" x2="90" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="127" y1="62" x2="127" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="164" y1="62" x2="164" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <!-- Road lines on map -->
  <line x1="57" y1="140" x2="197" y2="140" stroke="#1e40af" stroke-width="3" opacity="0.5"/>
  <line x1="115" y1="62" x2="115" y2="222" stroke="#1e40af" stroke-width="3" opacity="0.5"/>
  <!-- Driver car dot -->
  <circle cx="130" cy="118" r="9" fill="#3b82f6" opacity="0.3"/>
  <circle cx="130" cy="118" r="5" fill="#60a5fa"/>
  <text x="130" y="107" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🚗</text>
  <!-- Pickup pin -->
  <circle cx="100" cy="150" r="7" fill="#22c55e" opacity="0.3"/>
  <circle cx="100" cy="150" r="3" fill="#4ade80"/>
  <!-- Destination pin -->
  <circle cx="158" cy="95" r="7" fill="#f43f5e" opacity="0.3"/>
  <circle cx="158" cy="95" r="3" fill="#fb7185"/>
  <!-- Route line -->
  <polyline points="100,150 115,140 130,118 145,105 158,95" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- Rider app bottom -->
  <rect x="57" y="225" width="140" height="110" rx="0" fill="#111827"/>
  <rect x="65" y="232" width="124" height="6" rx="3" fill="#1e40af" opacity="0.5"/>
  <text x="127" y="252" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">Finding Driver…</text>
  <rect x="65" y="258" width="80" height="5" rx="2" fill="#374151"/>
  <rect x="65" y="268" width="60" height="5" rx="2" fill="#374151"/>
  <text x="127" y="295" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">⏱</text>
  <text x="127" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ETA: 3 min</text>
  <rect x="65" y="320" width="124" height="22" rx="11" fill="#1d4ed8"/>
  <text x="127" y="335" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">Request Ride</text>
  <!-- Label -->
  <text x="127" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Rider App</text>

  <!-- ── FIREBASE / GEOFIRE CENTER ── -->
  <rect x="278" y="90" width="244" height="240" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="278" y="90" width="244" height="38" rx="14" fill="#1c1109"/>
  <rect x="278" y="116" width="244" height="12" rx="0" fill="#1c1109"/>
  <text x="400" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle">⚡ Firebase Realtime Engine</text>

  <!-- GeoFire block -->
  <rect x="290" y="140" width="220" height="50" rx="8" fill="#1e293b"/>
  <text x="310" y="158" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">📍 GeoFire</text>
  <text x="310" y="172" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Geohash proximity queries</text>
  <rect x="420" y="150" width="78" height="14" rx="7" fill="#064e3b" opacity="0.8"/>
  <text x="459" y="161" font-family="system-ui, sans-serif" font-size="8" fill="#34d399" text-anchor="middle">Driver matching</text>

  <!-- Firestore block -->
  <rect x="290" y="198" width="104" height="50" rx="8" fill="#1e293b"/>
  <text x="310" y="216" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fb923c">🔥 Firestore</text>
  <text x="310" y="228" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Real-time ride</text>
  <text x="310" y="239" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">state sync</text>

  <!-- Auth block -->
  <rect x="402" y="198" width="108" height="50" rx="8" fill="#1e293b"/>
  <text x="420" y="216" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">🔐 Auth</text>
  <text x="420" y="228" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Rider &amp; Driver</text>
  <text x="420" y="239" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">identity mgmt</text>

  <!-- Google Maps block -->
  <rect x="290" y="256" width="220" height="50" rx="8" fill="#1e293b"/>
  <text x="310" y="274" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#60a5fa">🗺 Google Maps API</text>
  <text x="310" y="288" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Live tracking · Route render · ETA calculation</text>

  <!-- Kotlin / Compose badges -->
  <rect x="290" y="314" width="100" height="26" rx="8" fill="#1c0d2e"/>
  <text x="340" y="331" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">🟣 Kotlin</text>
  <rect x="398" y="314" width="112" height="26" rx="8" fill="#0d1c2e"/>
  <text x="454" y="331" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">⚛ Jetpack Compose</text>

  <!-- ── DRIVER PHONE (right) ── -->
  <rect x="594" y="48" width="158" height="310" rx="20" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <rect x="603" y="62" width="140" height="284" rx="8" fill="#111827"/>
  <!-- Notch -->
  <rect x="648" y="53" width="48" height="12" rx="6" fill="#1e293b"/>
  <!-- Map on driver phone -->
  <rect x="603" y="62" width="140" height="160" rx="8" fill="url(#mapGrad)"/>
  <!-- Grid -->
  <line x1="603" y1="95" x2="743" y2="95" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="603" y1="128" x2="743" y2="128" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="603" y1="161" x2="743" y2="161" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="636" y1="62" x2="636" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="673" y1="62" x2="673" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="710" y1="62" x2="710" y2="222" stroke="#1e3a5f" stroke-width="0.8"/>
  <!-- Roads -->
  <line x1="603" y1="128" x2="743" y2="128" stroke="#1e40af" stroke-width="3" opacity="0.5"/>
  <line x1="660" y1="62" x2="660" y2="222" stroke="#1e40af" stroke-width="3" opacity="0.5"/>
  <!-- Driver position -->
  <circle cx="673" cy="118" r="9" fill="#22c55e" opacity="0.3"/>
  <circle cx="673" cy="118" r="5" fill="#4ade80"/>
  <text x="673" y="107" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">📍</text>
  <!-- Rider pickup -->
  <circle cx="636" cy="150" r="7" fill="#3b82f6" opacity="0.3"/>
  <circle cx="636" cy="150" r="3" fill="#60a5fa"/>
  <polyline points="673,118 660,128 648,140 636,150" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- Driver app bottom -->
  <rect x="603" y="225" width="140" height="110" rx="0" fill="#111827"/>
  <rect x="611" y="232" width="124" height="6" rx="3" fill="#166534" opacity="0.5"/>
  <text x="673" y="252" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">Ride Request!</text>
  <rect x="611" y="258" width="90" height="5" rx="2" fill="#374151"/>
  <rect x="611" y="268" width="68" height="5" rx="2" fill="#374151"/>
  <text x="673" y="292" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">1.2 km away · ₹180</text>
  <rect x="611" y="300" width="58" height="22" rx="11" fill="#15803d"/>
  <text x="640" y="315" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">Accept</text>
  <rect x="675" y="300" width="58" height="22" rx="11" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="704" y="315" font-family="system-ui, sans-serif" font-size="9" fill="#f87171" text-anchor="middle">Decline</text>
  <!-- Label -->
  <text x="673" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Driver App</text>

  <!-- Title -->
  <text x="400" y="408" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">RidOn</text>
  <text x="400" y="434" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Android · Kotlin · Firebase · GeoFire · Live Tracking</text>
</svg>
