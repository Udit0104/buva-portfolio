<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Road -->
  <rect x="0" y="300" width="800" height="150" fill="#0f172a"/>
  <rect x="0" y="298" width="800" height="4" fill="url(#accent)"/>
  <!-- Lane dashes -->
  <rect x="50" y="350" width="80" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="200" y="350" width="80" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="350" y="350" width="80" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="500" y="350" width="80" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="650" y="350" width="80" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <!-- Car body -->
  <rect x="300" y="240" width="200" height="65" rx="12" fill="url(#accent)"/>
  <rect x="330" y="210" width="140" height="50" rx="10" fill="#818cf8"/>
  <!-- Windows -->
  <rect x="340" y="218" width="55" height="36" rx="6" fill="#1e1b4b" opacity="0.8"/>
  <rect x="405" y="218" width="55" height="36" rx="6" fill="#1e1b4b" opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="340" cy="308" r="22" fill="#1e293b"/>
  <circle cx="340" cy="308" r="12" fill="#475569"/>
  <circle cx="460" cy="308" r="22" fill="#1e293b"/>
  <circle cx="460" cy="308" r="12" fill="#475569"/>
  <!-- Headlights -->
  <rect x="492" y="255" width="18" height="10" rx="5" fill="#fbbf24" opacity="0.9"/>
  <rect x="294" y="255" width="18" height="10" rx="5" fill="#f87171" opacity="0.7"/>
  <!-- Map pin icon -->
  <circle cx="560" cy="120" r="30" fill="#6366f1" opacity="0.2"/>
  <circle cx="560" cy="110" r="14" fill="none" stroke="#818cf8" stroke-width="3"/>
  <circle cx="560" cy="110" r="5" fill="#818cf8"/>
  <line x1="560" y1="124" x2="560" y2="140" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Title -->
  <text x="400" y="80" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">RideOn</text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Uber-style Ride Hailing App</text>
  <!-- Tech badges -->
  <rect x="200" y="170" width="90" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="245" y="189" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">React Native</text>
  <rect x="305" y="170" width="70" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="340" y="189" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">Node.js</text>
  <rect x="390" y="170" width="80" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="430" y="189" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">MongoDB</text>
  <rect x="485" y="170" width="80" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="525" y="189" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">Socket.io</text>
</svg>
